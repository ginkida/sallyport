# Dependabot — weekly dependency + GitHub Actions update PRs, plus the
# security-update PRs GitHub opens automatically for known advisories.
# Three ecosystems live in this monorepo: the Python daemon, the Node
# extension, and the workflow actions themselves.
version: 2
updates:
  - package-ecosystem: pip
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      daemon-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      extension-deps:
        patterns: ['*']
    # Patch/minor (and any advisory-driven security update, which ignore
    # never blocks) flow automatically; major bumps of the dev toolchain
    # (eslint, typescript, vitest, …) are adopted deliberately, not as
    # weekly auto-PRs that break lint/typecheck.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # @types/chrome ships on a 0.x line where even a Dependabot-"patch"
      # bump breaks typecheck: 0.0.270 -> 0.0.332 already drops
      # chrome.tabs.TabChangeInfo and marks chrome.windows.create's result
      # nullable (src/tools/tabs.ts, src/tools/agent-window.ts), and the
      # 0.2.x minor adds a chrome.alarms.create signature change on top.
      # None of the global major/minor rules catch a 0.0.x patch, so freeze
      # @types/chrome outright — its breaks touch invariant-#13 code and are
      # adopted deliberately with matching source edits, never as a weekly
      # auto-PR that fails CI.
      - dependency-name: '@types/chrome'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-patch']

  # Keeps the SHA-pinned actions in .github/workflows/ current (Dependabot
  # bumps both the pinned SHA and the # vX.Y.Z comment). Major bumps are
  # ignored to keep CI on the tested action majors — security advisories
  # still come through regardless of this ignore, and patch/minor SHA
  # updates within the major are still applied.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
