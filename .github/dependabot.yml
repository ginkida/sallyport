# Dependabot — weekly dependency + GitHub Actions update PRs, plus the
# security-update PRs GitHub opens automatically for known advisories.
# Three ecosystems live in this monorepo: the Python daemon, the Node
# extension, and the workflow actions themselves.
version: 2
updates:
  - package-ecosystem: pip
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      daemon-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      extension-deps:
        patterns: ['*']
    # Patch/minor (and any advisory-driven security update, which ignore
    # never blocks) flow automatically; major bumps of the dev toolchain
    # (eslint, typescript, vitest, …) are adopted deliberately, not as
    # weekly auto-PRs that break lint/typecheck.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # @types/chrome ships on a 0.x line where a Dependabot-"minor" bump
      # (0.0.x -> 0.2.x) is a breaking API change under caret semantics and
      # needs code adaptation (chrome.alarms.create signature,
      # chrome.windows.create nullability, chrome.tabs.TabChangeInfo removal).
      # The global semver-major ignore doesn't catch it (major stays 0), so
      # hold minor here too — adopt @types/chrome breaks deliberately, not as
      # a weekly auto-PR that fails typecheck.
      - dependency-name: '@types/chrome'
        update-types: ['version-update:semver-minor']

  # Keeps the SHA-pinned actions in .github/workflows/ current (Dependabot
  # bumps both the pinned SHA and the # vX.Y.Z comment). Major bumps are
  # ignored to keep CI on the tested action majors — security advisories
  # still come through regardless of this ignore, and patch/minor SHA
  # updates within the major are still applied.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
