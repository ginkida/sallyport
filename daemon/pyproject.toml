[project]
name = "sallyport"
version = "0.23.0"
description = "MCP server bridging Claude Code to a browser extension over WS+HMAC"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ginkida" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "anthropic",
    "browser-automation",
    "chrome",
    "security",
    "hmac",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Security",
]
dependencies = [
    # Upper-bounded at the next major: the MCP SDK churns its API across the
    # 1.x line, so an unbounded floor would let a fresh install pull a future
    # release that breaks startup. Tested against mcp 1.26.0 / websockets 16.0.
    "mcp>=1.0.0,<2.0.0",
    "websockets>=13.0,<17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sallyport-daemon = "sallyport_daemon.__main__:main"

[project.urls]
Homepage = "https://github.com/ginkida/sallyport"
Repository = "https://github.com/ginkida/sallyport"
Issues = "https://github.com/ginkida/sallyport/issues"
Changelog = "https://github.com/ginkida/sallyport/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=sallyport_daemon",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["sallyport_daemon"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "PT"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
# Tests legitimately: use hardcoded secrets (S105/S106), seed PRNG (S311),
# run blocking I/O in async contexts (ASYNC230/240), and spawn subprocesses
# with controlled arg lists (S603).
"tests/**" = ["S105", "S106", "S311", "S603", "ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["sallyport_daemon"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# The mcp SDK's decorators are untyped — silence the noise from server.list_tools / call_tool.
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sallyport_daemon.mcp_server"
disallow_untyped_decorators = false

[build-system]
# Pinned below 1.32 because that release started stamping wheels
# `Metadata-Version: 2.5`, which the twine bundled inside the SHA-pinned
# pypa/gh-action-pypi-publish still rejects outright:
#   InvalidDistribution: Invalid distribution metadata: '2.5' is not a valid
#   metadata version
# It fails at UPLOAD time, after the tag and the GitHub Release already exist —
# and publish.yml's own `twine check` step does not catch it, because that step
# installs the newest twine, which accepts 2.5 quite happily. So the two twines
# disagree and only the one we do not control gets a veto. 2.4 is the floor this
# project actually needs (PEP 639 `license`/`license-files`), so nothing is lost
# by staying there. Lift the pin once the pinned action ships a twine that knows
# 2.5 — and verify by publishing, not by the local `twine check`.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sallyport_daemon"]

# The test suite resolves the shared cross-language fixture at repo-root
# (fixtures/canonical-vectors.json), which lives outside this package — so the
# tests can't run from an sdist. Ship a clean sdist (src + metadata + docs)
# rather than tests that would error on a fresh extract.
[tool.hatch.build.targets.sdist]
exclude = ["/tests"]
